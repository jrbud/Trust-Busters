<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Trust Busters</title>
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  <style>
    @font-face {
      font-family: 'Monopoly';
      src: url('../static/monopoly.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    @font-face {
      font-family: 'Copperplate Gothic';
      src: url('../static/copperplate.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    body, h1, h2, h3, p, input, button, label {
      font-family: 'Monopoly', sans-serif;
    }

    body {
      margin: 2em;
      text-align: center;
      background-color: #BFDBAE;
      color: #000000;
    }

    h1 {
      font-size: 7em;
      color: #ffffff;
      background-color: #C70000;
      border: 4px solid #ffffff;
      padding: 0.1em 0.2em;
      margin: 0.2em auto;
      line-height: 1;
      display: inline-block;
      text-align: center;
    }

    .search-bar {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-top: 1em;
    }

    .input-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .input-wrapper {
      position: relative;
      width: 300px;
    }

    input[type="text"] {
      padding: 8px;
      font-size: 1em;
      width: 100%;
      box-sizing: border-box;
      background-color: #b9e3f7;
      color: #000000;
      border: 3px solid #444;
    }

    button {
      padding: 8px 16px;
      font-size: 1em;
      background-color: #D7BAAA;
      color: #e40c03;
      border: 3px solid #e40c03;
      cursor: pointer;
    }

    button:hover {
      background-color: #444;
    }

    label {
      font-size: 0.95em;
    }

    ul.suggestions {
      position: absolute;
      text-align: left;
      top: 100%;
      left: 0;
      right: 0;
      list-style: none;
      padding: 0;
      margin: 0;
      border: 1px solid #444;
      background: #1e1e1e;
      z-index: 10;
      max-height: 200px;
      overflow-y: auto;
    }

    ul.suggestions li {
      padding: 8px;
      cursor: pointer;
      color: #f0f0f0;
    }

    ul.suggestions li:hover {
      background-color: #333;
    }

    #results {
      margin-top: 2em;
    }

    .deed-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 32px 40px;
      justify-content: center;
      margin: 2em auto;
      max-width: 1200px;
    }

    .deed-card {
      background-color: #fff;
      color: #000;
      border: 4px solid #000000;
      outline: 4px solid #ffffff;
      width: 180px;
      height: 270px;
      box-shadow: 0 2px 8px rgba(63, 69, 81, 0.16);
      display: flex;
      flex-direction: column;
      justify-content: stretch;
      align-items: center;
      overflow: hidden;
      padding: 0;
    }

    .deed-card h3 {
      flex: 1;
      margin: 0;
      width: 100%;
      font-size: 1.1em;
      border-bottom: 2px solid #000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.5em;
      color: #000;
      text-transform: uppercase;
      font-family: 'Copperplate Gothic', 'Copperplate', serif;
    }

    .deed-card p {
      flex: 4;
      margin: 0;
      width: 100%;
      font-size: 0.9em;
      padding: 1em 0.5em;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>TRUST BUSTER</h1>
  <p>Enter the company, brand, or product you want to BUST!</p>

  <div class="search-bar">
    <div class="input-row">
      <div class="input-wrapper">
        <input type="text" id="companyInput" placeholder="Enter company name" oninput="getSuggestions()" />
        <ul id="suggestions" class="suggestions"></ul>
      </div>
      <button onclick="searchCompany()">GO</button>
    </div>

    <label>
      <input type="checkbox" id="ethicsCheckbox" />
      Analyze ethical concerns with AI
    </label>
  </div>

  <div id="results"></div>

  <script>
    const colors = [
      "#e40c03", "#ffeb00", "#00ae41", "#0068b3",
      "#94481a", "#b9e3f7", "#d62f8c", "#ef8c00"
    ];

    function getRandomColor() {
      return colors[Math.floor(Math.random() * colors.length)];
    }

    async function getSuggestions() {
      const input = document.getElementById('companyInput').value;
      if (input.length < 1) {
        document.getElementById('suggestions').innerHTML = '';
        return;
      }
      const res = await fetch(`/api/suggest?q=${encodeURIComponent(input)}`);
      const suggestions = await res.json();
      const list = suggestions.map(name => `<li onclick="selectSuggestion('${name}')">${name}</li>`).join('');
      document.getElementById('suggestions').innerHTML = list;
    }

    function selectSuggestion(name) {
      document.getElementById('companyInput').value = name;
      document.getElementById('suggestions').innerHTML = '';
      searchCompany();
    }

    async function searchCompany() {
      const name = document.getElementById('companyInput').value;
      const useEthics = document.getElementById('ethicsCheckbox').checked;

      const res = await fetch(`/api/company?name=${encodeURIComponent(name)}`);
      const data = await res.json();

      if (data.error) {
        document.getElementById('results').innerHTML = `<p style="color:red;">${data.error}</p>`;
        return;
      }

      let html = `<h2>Results for ${data.company.toUpperCase()}</h2>`;

      const brands = data.type === "company" ? data.children : data.sisters;
      const owner = data.type === "company" ? data.company : data.parent;

      html += `<p><strong>${data.company}</strong> is a <strong>${data.type}</strong> ${
        data.type === "brand"
          ? `owned by <strong>${data.parent}</strong> with ${brands.length} sister brand${brands.length !== 1 ? 's' : ''}`
          : `that owns ${brands.length} brand${brands.length !== 1 ? 's' : ''}`
      }.</p>`;

      if (useEthics) {
        try {
          const ethicsRes = await fetch(`/ai-check?name=${encodeURIComponent(data.parent)}`);
          const ethicsText = await ethicsRes.text();
          html += `<p><em>${ethicsText}</em></p>`;
        } catch (error) {
          html += `<p><em>AI ethical analysis failed to load.</em></p>`;
        }
      }

      html += `<div class="deed-grid">`;

brands.forEach((b, i) => {
  const bgColor = getRandomColor();
  html += `
    <div class="deed-card" style="animation-delay: ${i * 0.2}s;">
      <h3 style="background-color: ${bgColor};">${b.toUpperCase()}</h3>
      <div class="deed-body">
        <p class="deed-owner-label">Owned by</p>
        <p class="deed-owner-name">${owner.toUpperCase()}</p>
      </div>
    </div>
  `;
});

html += `</div>`;

      document.getElementById('results').innerHTML = html;
    }
     document.addEventListener('click', function (event) {
      const inputWrapper = document.querySelector('.input-wrapper');
      const suggestionsBox = document.getElementById('suggestions');
      if (!inputWrapper.contains(event.target)) {
        suggestionsBox.innerHTML = '';
      }
    });

    // Re-show suggestions only when typing
    document.get
  </script>
</body>
</html>
